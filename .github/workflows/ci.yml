name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e src/llm_arm_agent pytest
      - name: Unit tests (sim, skills, tasks, agent loop with a fake API client)
        run: pytest -q src/llm_arm_agent/test
      - name: Oracle benchmark (validates all 15 tasks end to end)
        run: llm-arm bench --planner oracle --out results/ci_oracle
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-results
          path: results/ci_oracle
